name: Build RASAD installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name RASAD
          --paths app --collect-all arabic_reshaper --hidden-import socks --hidden-import urllib3.contrib.socks --icon assets/rasad.ico --add-data "assets;assets" app/rasad.py

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') } else { $v = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer\rasad.iss

      - uses: actions/upload-artifact@v4
        with:
          name: RASAD-Setup
          path: installer_output/*.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/*.exe
